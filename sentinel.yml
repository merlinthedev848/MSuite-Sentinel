# mView Sentinel configuration.
# Environment variables override these values.
# Leave jwt_secret unset. A random secret is created on first start.
# The public placeholders CHANGE-ME-IN-PRODUCTION-USE-RANDOM-SECRET and
# super-secret-mview-key are rejected.

system:
  # Compose builds DATABASE_URL from the generated Postgres password.
  mqtt_broker: "127.0.0.1"
  storage_path: "/mnt/storage/mview"

ai:
  # The default image runs YOLO on CPU. CUDA is a separate compose override.
  accelerator: "cpu"
  object_model: "yolov8n"
  min_confidence: 0.5
  # ALPR and face recognition are not installed. Leaving these on does not invent plates or faces.
  enable_alpr: false
  enable_face_recognition: false
  provider: "local"

recordings:
  retention_days: 14
  segment_length_seconds: 60

notifications:
  discord_webhook: ""
  telegram_bot_token: ""

cameras: []
