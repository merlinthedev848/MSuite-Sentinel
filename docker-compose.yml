services:
  secrets-init:
    image: alpine:3.20
    container_name: sentinel-secrets
    volumes:
      - sentinel_secrets:/secrets
      - ./docker/bootstrap-secrets.sh:/bootstrap-secrets.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-secrets.sh"]
    restart: "no"

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: sentinel-go2rtc
    network_mode: host
    volumes:
      - sentinel_secrets:/config
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: mview-sentinel-api:local
    pull_policy: never
    build:
      context: ./
      dockerfile: api/Dockerfile
    container_name: sentinel-api
    network_mode: host          # Host networking so ONVIF UDP multicast reaches LAN cameras
    entrypoint: ["/entrypoint-api.sh"]
    command: ["python", "/serve_api.py"]
    environment:
      - SENTINEL_SECRETS_DIR=/run/sentinel/secrets
      - MQTT_BROKER=127.0.0.1
      - RECORDINGS_DIR=/mnt/storage/mview/recordings
      - SEGMENT_SECONDS=60
      - RECORD_SUBSTREAM_DEFAULT=true
      - RECORD_VIDEO_CODEC=copy
      - RECORD_VIDEO_CRF=30
      - RECORD_VIDEO_PRESET=veryfast
    volumes:
      - /mnt/storage/mview/recordings:/mnt/storage/mview/recordings
      - /opt/mview-sentinel:/opt/mview-sentinel
      - sentinel_secrets:/run/sentinel/secrets
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  detector:
    image: mview-sentinel-detector:local
    pull_policy: never
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: sentinel-detector
    network_mode: host
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - SENTINEL_SECRETS_DIR=/run/sentinel/secrets
      - MQTT_BROKER=127.0.0.1
      - MQTT_PORT=1883
      - API_URL=http://127.0.0.1:8000/cameras
      - ACCELERATOR=cpu
      - DETECTOR_MODEL=yolov8n.pt
      - FRAME_STRIDE=6
      - FRAMES_PER_CAMERA=48
      - IMAGE_SIZE=640
      - MIN_CONFIDENCE=0.5
      - EVENT_COOLDOWN_SECONDS=5
      - DETECT_CLASSES=0,2,3,5,7
    volumes:
      - sentinel_secrets:/run/sentinel/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
      go2rtc:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: sentinel-postgres
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD_FILE=/run/sentinel/secrets/postgres_password
      - POSTGRES_DB=sentinelnvr
    volumes:
      - postgres_data:/var/lib/postgresql
      - sentinel_secrets:/run/sentinel/secrets:ro
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelnvr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: sentinel-mqtt
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/entrypoint-mqtt.sh:/entrypoint-mqtt.sh:ro
      - sentinel_secrets:/run/sentinel/secrets:ro
      - mqtt_data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    entrypoint: ["/bin/sh", "/entrypoint-mqtt.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  mqtt_data:
  sentinel_secrets:
